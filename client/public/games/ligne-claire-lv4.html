<title>Nét Mực Ligne Claire</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{--ink:#15131a;--cream:#f4ead2;--paper:#f7efdc;--sepia:#6b4a2a;--wood:#5a3a22;--red:#d8352a;--blue:#2f5fa8;--gold:#e0b25a;--comic:"Marker Felt","Chalkboard SE","Comic Sans MS",ui-rounded,sans-serif}

    background:

      repeating-linear-gradient(88deg,#ffffff07 0 1px,transparent 1px 23px,#00000012 23px 26px,transparent 26px 57px),

  #lamp{position:fixed;inset:0;pointer-events:none;background:

  #desk{position:relative;height:100%;display:grid;grid-template-columns:172px 1fr 318px;grid-template-rows:54px 1fr;gap:10px 18px;padding:8px 20px 76px}
  #plate{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 6px}
  #plate h1{margin:0;font:800 24px var(--comic);letter-spacing:.5px;color:#f7e6c4;text-shadow:0 2px 0 #2a1608,0 0 18px #ffd89a44}
  #plate .brass{padding:4px 12px;border-radius:6px;font:700 12px var(--comic);letter-spacing:2px;color:#3a2410;background:linear-gradient(#f3d58a,#c99a3c);box-shadow:0 2px 0 #7a5a18,inset 0 1px 0 #fff8;border:1px solid #8a6a22}
  #plate .sub{font-size:12px;color:#d9c3a0;opacity:.85}
  /* corkboard level selector */
  #cork{position:relative;border-radius:10px;padding:12px 10px 10px;background:
      radial-gradient(circle at 30% 20%,#d4a473 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,#9a6a3c 0 1px,transparent 2px),
      repeating-radial-gradient(circle at 50% 50%,#c69560 0 3px,#b8864f 3px 6px);background-size:11px 11px,13px 13px,100% 100%;
      box-shadow:inset 0 0 0 6px #4a2c14,inset 0 0 18px #0008,0 10px 24px #0007}
  #cork .ct{font:700 13px var(--comic);color:#3a2410;text-align:center;margin:2px 0 8px;letter-spacing:1px}
  #lv{display:flex;flex-direction:column;gap:4px}
  #lv button{position:relative;display:flex;align-items:center;gap:8px;padding:3px 6px 3px 8px;border:0;border-radius:4px;background:#fffbe9;color:#3a2410;font:800 13px var(--comic);cursor:pointer;box-shadow:0 3px 6px #0006;transform:rotate(-1.2deg);transition:transform .15s}
  #lv button:nth-child(even){transform:rotate(1deg)}
  #lv button canvas{width:40px;height:40px;border:1px solid #c9b58f;background:#fff}
  #lv button .n{display:inline-block;min-width:22px;padding:2px 4px;border-radius:50%;border:2px solid var(--red);color:var(--red);font-size:11px;text-align:center;transform:rotate(-8deg)}
  #lv button.on{transform:rotate(0) scale(1.05);box-shadow:0 0 0 2px var(--gold),0 6px 12px #0007;z-index:1}
  #lv button.on::before{content:'';position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b01f12);box-shadow:0 2px 3px #0008;transform:translateX(-50%)}
  #lv button:disabled{background:#3a2616;color:#b89a7a;cursor:not-allowed;box-shadow:0 2px 4px #0006}

  #lv button:disabled .n{border-color:#8a6a4a;color:#c8a888}
  #lv button .lock{display:inline-block;width:40px;height:40px;line-height:40px;text-align:center;font-size:20px;background:#1a0e06;border:1px solid #1a0e06}

  #sheetWrap{position:relative;min-width:0;min-height:0}
  #c{width:100%;height:100%;display:block;border-radius:3px;cursor:crosshair;box-shadow:0 22px 46px #0009,0 4px 10px #0006,0 1px 0 #fff4 inset}

  #sheetWrap.rustle{animation:rustle .45s ease-out}
  @keyframes rustle{0%{transform:rotate(-1.2deg) translateY(-6px)}60%{transform:rotate(.5deg) translateY(2px)}100%{transform:none}}

  .tape.tl{left:-24px;top:10px;transform:rotate(-40deg)}.tape.tr{right:-24px;top:10px;transform:rotate(40deg)}.tape.bl{left:-24px;bottom:12px;transform:rotate(40deg)}.tape.br{right:-24px;bottom:12px;transform:rotate(-40deg)}

  #refCard .pin{position:absolute;top:-7px;left:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8fd3ff,#1d4a8a);box-shadow:0 3px 4px #0008;transform:translateX(-50%)}
  #tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tool{padding:9px 4px;border:2px solid #2a1608;border-radius:8px;background:linear-gradient(#9a6a3a,#5a3a1a);color:#f7e6c4;font:800 13px var(--comic);cursor:pointer;box-shadow:0 4px 0 #2a1608,0 6px 12px #0007,inset 0 1px 0 #fff5;transition:transform .08s,box-shadow .08s}
  .tool:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1608}
  #hand{grid-column:span 4}#hand.on{background:linear-gradient(#8fd3ff,#2f5fa8);color:#fff;border-color:#1d3a6a}
  #zl{grid-column:span 4;text-align:center;font:700 12px var(--comic);color:#d9c3a0;margin-top:-2px}
  #submit{align-self:center;padding:12px 28px;border:4px double var(--red);border-radius:10px;background:#fff6;color:var(--red);font:900 22px var(--comic);letter-spacing:3px;cursor:pointer;transform:rotate(-3deg);box-shadow:0 8px 16px #0006;text-shadow:0 0 1px #d8352a;transition:transform .1s}
  #submit:hover{transform:rotate(-3deg) scale(1.05)}#submit:active{transform:rotate(-3deg) scale(.97)}
  #hint{font-size:11px;transform:rotate(-1.5deg);margin-top:auto}
  /* desk props */
  .prop{position:fixed;pointer-events:none;filter:drop-shadow(0 6px 5px #0007)}
  /* overlays */
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1a0e06b0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10}
  #fx{position:absolute;inset:0;width:100%;height:100%}
  #card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 28px 26px;max-width:460px;background:linear-gradient(#fffbe9,#f4e8cc);color:#3a2410;box-shadow:0 30px 60px #000b;transform:rotate(-1deg)}
  #card::before{content:'';position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(-2deg);background:repeating-linear-gradient(135deg,#f2d8a6cc 0 6px,#e7c48fcc 6px 12px);box-shadow:0 2px 4px #0005}
  #stamp{position:absolute;z-index:2;top:18px;right:-14px;padding:6px 14px;border:4px double currentColor;border-radius:8px;font:900 26px var(--comic);letter-spacing:3px;transform:rotate(12deg);opacity:.85;mix-blend-mode:multiply}

  #prize{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #mt{font:800 20px var(--comic)}
  #mc{font-size:32px;letter-spacing:2px;font-weight:900;color:var(--red);font-family:var(--comic)}

  #ms{color:#6b4a2a;font-size:14px;line-height:1.45}
  #again{margin-top:6px;padding:12px 30px;border:3px solid #2a1608;border-radius:10px;font:900 17px var(--comic);background:linear-gradient(#f3d58a,#c99a3c);color:#2a1608;box-shadow:0 5px 0 #7a5a18,0 8px 20px #0006;cursor:pointer}
  #again:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a18}
  /* desktop-only gate */
  #block{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:#1a0e06d0}
  #block .note{max-width:520px;margin:20px;padding:34px 30px;background:linear-gradient(#fffbe9,#f4e8cc);color:#3a2410;text-align:center;transform:rotate(-1.5deg);box-shadow:0 30px 60px #000c;font:700 18px var(--comic);line-height:1.5}
  #block .note b{display:block;font-size:40px;margin-bottom:8px}
</style>

  g.fillStyle='#b8a07a2a';for(let i=0;i<900;i++){const a=SEED[i%40],b=SEED[(i*7+3)%40];g.fillRect(((a[0]*997+i*53)%W),((b[1]*991+i*37)%H),1.2,1.2)}

  g.strokeStyle='#8fb8e8';g.lineWidth=1;g.setLineDash([]);g.strokeRect(m,m+26,W-2*m,H-2*m-26);
  g.strokeStyle='#8fb8e8aa';[[m,m+26],[W-m,m+26],[m,H-m],[W-m,H-m]].forEach(([x,y])=>{g.beginPath();g.moveTo(x-18,y);g.lineTo(x-6,y);g.moveTo(x+6,y);g.lineTo(x+18,y);g.moveTo(x,y-18);g.lineTo(x,y-6);g.moveTo(x,y+6);g.lineTo(x,y+18);g.stroke()});
  g.strokeStyle='#8fb8e855';g.setLineDash([3,5]);g.beginPath();g.moveTo(m,H-m);g.lineTo(W-m,m+26);g.moveTo(W/2,m+26);g.lineTo(W/2,H-m);g.stroke();g.beginPath();g.arc(W/2,(H+26)/2,Math.min(W,H)*.2,0,7);g.stroke();g.setLineDash([]);
  g.strokeStyle='#8fb8e8';for(let x=m;x<W-m;x+=Math.max(20,(W-2*m)/12)){g.beginPath();g.moveTo(x,m+20);g.lineTo(x,m+26);g.stroke()}
  // hand-lettered title + level stamp
  g.font='800 17px '+'"Marker Felt","Chalkboard SE","Comic Sans MS",ui-rounded,sans-serif';g.fillStyle='#6b4a2a';g.fillText(`Planche ${lv+1} · ${L.name}`,m+4,m+18);
  g.strokeStyle='#6b4a2a';g.lineWidth=1.5;g.beginPath();g.moveTo(m+2,m+22);g.quadraticCurveTo(m+60,m+26,m+180,m+21);g.stroke();
  g.save();g.translate(W-m-70,m+12);g.rotate(-.12);g.strokeStyle='#d8352a99';g.lineWidth=2;g.strokeRect(-46,-12,92,24);g.fillStyle='#d8352a99';g.font='800 12px "Marker Felt","Chalkboard SE","Comic Sans MS",sans-serif';g.textAlign='center';g.fillText(`OBJECTIF ${PASS[lv]*100}%`,0,5);g.restore();
  g.fillStyle='#6b4a2a77';g.font='700 10px "Marker Felt","Chalkboard SE","Comic Sans MS",sans-serif';g.textAlign='right';g.fillText('Atelier BD · Bruxelles · N°'+(lv+1),W-m,H-m+16);g.textAlign='left';
}
function nib(x,y,on){
  ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/4);ctx.lineCap='round';
  ctx.strokeStyle='#1f2a44';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(70,0);ctx.stroke();
  ctx.strokeStyle='#e2b24a';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(23,0);ctx.stroke();
  ctx.strokeStyle='#d8352a';ctx.beginPath();ctx.moveTo(60,0);ctx.lineTo(70,0);ctx.stroke();
  ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(25,-2.5);ctx.lineTo(57,-2.5);ctx.stroke();
  ctx.fillStyle='#ddd8cb';ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(16,-5.5);ctx.lineTo(19,0);ctx.lineTo(16,5.5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='#555';ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(11,0);ctx.stroke();ctx.fillStyle='#555';ctx.beginPath();ctx.arc(11,0,1.3,0,7);ctx.fill();

const WB=[.72,.9,1.08,1.26]; // ink line-weight buckets (x base width): fast strokes thin out, slow strokes swell
function drawInk(X,Y,w){
  const paths=WB.map(()=>new Path2D());

    for(let i=1;i<st.length;i++){const a=st[i-1],b=st[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),f=Math.max(0,Math.min(3,Math.round(3-d*160)));paths[f].moveTo(X(a[0]),Y(a[1]));paths[f].lineTo(X(b[0]),Y(b[1]))}});
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#15131a';
  paths.forEach((p,i)=>{ctx.lineWidth=w*WB[i];ctx.stroke(p)});
  ctx.strokeStyle='#8a8fb0';ctx.globalAlpha=.22;paths.forEach((p,i)=>{ctx.lineWidth=w*WB[i]*.3;ctx.stroke(p)});ctx.globalAlpha=1; // soft ink gloss
}
function draw(dt){
  const [W,H]=fit(c,ctx); if(W<2||H<2)return; if(K.W!==W||K.H!==H){buildBg(W,H);clampView()}
  const dpr=devicePixelRatio||1,{S,ox,oy}=K, X=x=>ox+x*S, Y=y=>oy+y*S, w=INK*S;
  ctx.setTransform(dpr*V.z,0,0,dpr*V.z,V.x*dpr,V.y*dpr);
  ctx.drawImage(bg,0,0,W,H);
  drawInk(X,Y,w);
  if(s.down&&!s.done&&Math.random()<.5)drops.push({x:X(s.px),y:Y(s.py),vx:(Math.random()-.5)*60,vy:-20-Math.random()*50,a:.5});
  ctx.fillStyle='#15131a';drops=drops.filter(p=>p.a>0);drops.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.a-=dt;ctx.globalAlpha=Math.max(0,p.a*1.6);ctx.beginPath();ctx.arc(p.x,p.y,1.6/V.z,0,7);ctx.fill()});ctx.globalAlpha=1;

  const sx=X(s.px)*V.z+V.x, sy=Y(s.py)*V.z+V.y;

}

// ---------- overlays: prize comic panel (win) / aligned comparison + full reference (fail) ----------
const T=v=>(16+v*168).toFixed(1), SP=pts=>pts.map(([x,y])=>T(x)+','+T(y)).join(' ');
const poly=(pts,f,extra='')=>`<polygon points="${SP(pts)}" fill="${f}" ${extra}/>`, circ=(x,y,r,f,extra='')=>`<circle cx="${T(x)}" cy="${T(y)}" r="${(r*168).toFixed(1)}" fill="${f}" ${extra}/>`;
const strk=(pts,col,wd)=>`<polyline points="${SP(pts)}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round" stroke-linejoin="round"/>`;
const bgc=f=>`<rect x="2" y="2" width="196" height="196" fill="${f}"/>`, ground=(y,f)=>`<rect x="2" y="${T(y)}" width="196" height="${200-T(y)}" fill="${f}"/>`;
const SKIN='#f6c9a0', P=(S,i)=>S[i].p;
const TINHAIR=[[.34,.38],[.38,.28],[.42,.20],[.48,.14],[.42,.10],[.34,.04],[.46,.08],[.56,.10],[.64,.16],[.68,.28],[.66,.36],[.62,.28],[.54,.24],[.44,.26],[.36,.32]];
const milouArt=(S,o,sc=1,tx=0,ty=0)=>poly(P(S,o),'#fff')+poly(P(S,o+4),'#f6e7c1')+circ(.17*sc+tx,.41*sc+ty,.022*sc,'#15131a')+strk(P(S,o+3),'#e63b2e',4*sc);
const tintinArt=(S,o,sc=1,tx=0,ty=0)=>poly(P(S,o+6),'#3a7bd5')+poly(xf([[.42,.66],[.50,.78],[.58,.66],[.56,.62],[.44,.62]],sc,tx,ty),'#fff')+poly(P(S,o),SKIN)+poly(xf(TINHAIR,sc,tx,ty),'#f0a53a')+poly(P(S,o+31),'#fff');
const HADFACE=[[.30,.34],[.70,.38],[.72,.46],[.68,.54],[.32,.54],[.28,.44]], HADPEAK=[[.72,.30],[.80,.32],[.84,.36],[.70,.38]];
const haddockArt=(S,o,sc=1,tx=0,ty=0)=>poly(P(S,o+15),'#3a7bd5')+poly(xf(HADFACE,sc,tx,ty),SKIN)+poly(P(S,o+6),'#15131a')+poly(P(S,o),'#1d2b55')+poly(xf(HADPEAK,sc,tx,ty),'#15131a')+poly(P(S,o+13),'#8a5a2b');
const dupArt=(S,o)=>poly(P(S,o+5),'#15131a')+poly(P(S,o+1),SKIN)+poly(P(S,o),'#15131a')+poly(P(S,o+2),'#15131a');
const ART=[
  S=>bgc('#7cc24a')+ground(.9,'#5a9a36')+milouArt(S,0),
  S=>bgc('#bfe3f7')+ground(.95,'#7cc24a')+poly(P(S,6),'#4fa3e0')+poly([[.34,.78],[.66,.78],[.66,.90],[.60,.96],[.54,.96],[.52,.88],[.48,.88],[.46,.96],[.40,.96],[.34,.90]],'#fff')+poly(P(S,1),'#4fa3e0')+poly(P(S,0),'#fff')+circ(.50,.47,.045,'#4fa3e0')+poly(P(S,8),'#e63b2e')+circ(.08,.69,.018,'#fff')+circ(.17,.66,.015,'#fff')+poly([[.08,.78],[.20,.78],[.20,.94],[.08,.94]],'#f6e7c1'),
  S=>bgc('#f2c14e')+tintinArt(S,0),
  S=>bgc('#bfe3f7')+ground(.9,'#2f8f4e')+strk(P(S,1),'#f2c14e',8)+poly(P(S,0),'#f2c14e')+circ(.40,.36,.035,'#15131a')+circ(.48,.50,.03,'#15131a')+circ(.34,.58,.028,'#15131a')+circ(.24,.30,.025,'#fff')+circ(.36,.24,.025,'#fff')+circ(.10,.38,.03,'#15131a')+poly(P(S,32),'#2f8f4e')+poly(P(S,34),'#2f8f4e'),
  S=>bgc('#f29a3e')+ground(.96,'#c98a4a')+poly([[.24,.96],[.26,.84],[.36,.78],[.64,.78],[.76,.84],[.80,.96]],'#f2c14e')+poly(P(S,1),SKIN)+poly(P(S,7),'#e63b2e')+poly(P(S,0),'#fffbe9')+poly(P(S,10),'#6e7383')+strk(P(S,6),'#c9a24a',2)+circ(.12,.12,.06,'#ffe66d')+poly(P(S,33),'#2f8f4e'),
  S=>bgc('#bfe3f7')+poly(P(S,9),'#e63b2e')+poly(P(S,2),SKIN)+poly(P(S,0),'#e63b2e')+poly([[.36,.23],[.66,.23],[.66,.27],[.36,.27]],'#15131a')+poly(P(S,15),'#b5651d')+strk(P(S,16),'#b5651d',5)+[[.42,.80],[.42,.88],[.58,.80],[.58,.88],[.42,.94],[.58,.94]].map(p=>circ(p[0],p[1],.012,'#f2c14e')).join('')+poly(P(S,43),'#f2c14e'),
  S=>bgc('#8fd3ff')+poly(P(S,8),'#2f8f4e')+poly(P(S,1),SKIN)+poly(P(S,0),'#15131a')+[9,10,11,12,13].map(i=>poly(P(S,i),'#fff')).join('')+poly(P(S,38),'#f0a53a'),
  (S,I)=>bgc('#e9c982')+ground(.95,'#9a9a8a')+poly(P(S,I.cloud),'#fff')+poly([[.02,.34],[.02,.14],[.08,.14],[.08,.08],[.18,.08],[.18,.14],[.24,.14],[.24,.34]],'#c9a24a')+poly([[.30,.34],[.30,.12],[.46,.06],[.62,.12],[.62,.34]],'#e63b2e')+dupArt(S,I.a)+dupArt(S,I.b)+poly(P(S,I.lamp+1),'#f2c14e'),
  (S,I)=>bgc('#bfe3f7')+ground(.96,'#9a9a8a')+poly(P(S,I.t+9),'#2f8f4e')+poly(P(S,I.t+1),SKIN)+poly(P(S,I.t+7),'#8a5a2b')+poly(P(S,I.t),'#2f8f4e')+poly(P(S,I.t+11),'#f2c14e')+poly(P(S,I.flask),'#8fd3ff')+poly(P(S,I.box),'#6e7383')+poly(P(S,I.shelf),'#8a5a2b')+milouArt(S,I.m,.28,.02,.70),

const frame=(inner,wd=230,rot=-3)=>`<svg viewBox="0 0 200 200" width="${wd}" style="transform:rotate(${rot}deg);filter:drop-shadow(0 8px 10px #0008)"><defs><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#000" opacity=".1"/></pattern></defs><rect x="2" y="2" width="196" height="196" fill="#f6ecd4"/>${inner}<rect x="2" y="2" width="196" height="196" fill="none" stroke="#15131a" stroke-width="4"/></svg>`;
const outline=(subs,col,wd,extra='')=>subs.map(P=>`<${P.closed?'polygon':'polyline'} points="${SP(P.p)}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`).join('');
const label=t=>`<rect x="4" y="178" width="192" height="18" fill="#fffbe9" stroke="#15131a" stroke-width="2"/><text x="100" y="191" text-anchor="middle" font-size="10" font-weight="700" fill="#15131a" font-family='${COMIC}'>${t}</text>`;
function panelSVG(k){
  const c=LV[k], fs=c.bubble.length>13?10:13;

  <text x="148" y="30" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#15131a" font-family='${COMIC}'>${c.bubble}</text>
  <rect x="4" y="178" width="${c.name.length*7+14}" height="18" fill="#fffbe9" stroke="#15131a" stroke-width="2"/><text x="11" y="191" font-size="11" font-weight="700" fill="#15131a" font-family='${COMIC}'>${c.name}</text>`);
}
function compareSVG(r){ // reference (blue) vs the player's ALIGNED ink (black); red = missed reference, orange = stray ink
  let q=outline(L.subs,'#4f7fc4',1);
  L.samp.forEach((p,i)=>{if(!r.cov[i]){const d=L.sampW[i]<1;q+=`<circle cx="${T(p[0])}" cy="${T(p[1])}" r="${d?1:1.6}" fill="#e63b2e" opacity="${d?.45:1}"/>`}});

const refSVG=()=>frame(outline(L.subs,'#15131a',1.2)+label('Hình mẫu – nhìn kỹ rồi vẽ lại'),160,2);

// ---------- win/lose particles ----------
const fxx=fx.getContext('2d'); let parts=[];
function boom(win){
  parts=[];const n=win?140:0;
  for(let i=0;i<n;i++)parts.push({x:Math.random(),y:-.1-Math.random()*.4,vx:(Math.random()-.5)*.25,vy:.15+Math.random()*.3,r:Math.random()*6.3,vr:(Math.random()-.5)*8,sz:5+Math.random()*7,c:['#e63b2e','#f2c14e','#3a7bd5','#fff3d0','#7cc24a','#8fd3ff'][i%6],s:Math.random()<.3});
}
function drawFx(dt){
  if(msg.style.display!=='flex')return;
  const [W,H]=fit(fx,fxx);fxx.clearRect(0,0,W,H);
  const now=performance.now()/1000;
  if(!parts.length){ // fail: ink drips sliding down
    fxx.strokeStyle='#00000040';fxx.lineWidth=5;fxx.lineCap='round';for(let i=0;i<10;i++){const x=(i+.5)*W/10+Math.sin(i*7)*12,y=((now*.08+i*.1)%1)*H;fxx.beginPath();fxx.moveTo(x,y-40);fxx.lineTo(x,y);fxx.stroke()}return}
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.15*dt;p.r+=p.vr*dt;p.vx*=.995;if(p.y>1.1){p.y=-.1;p.x=Math.random();p.vy=.15+Math.random()*.3}
    fxx.save();fxx.translate(p.x*W,p.y*H);fxx.rotate(p.r);fxx.fillStyle=p.c;
    if(p.s){fxx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,r=k%2?p.sz*.4:p.sz;fxx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}fxx.fill()}
    else fxx.fillRect(-p.sz/2,-p.sz/3,p.sz,p.sz*.66);
    fxx.restore()});
}

// test hook (scripts/ligne-check.ts): the strokes / score of the drawing in progress; perfect() traces the reference (a pass)
window.__LIGNE__={lv:()=>lv,strokes:()=>s.strokes.map(st=>st.map(q=>q.slice(0,2))),score:()=>evaluate(s.strokes).sc,saved:()=>localStorage.getItem(SK(lv)),key:()=>KEY,
  perfect:()=>{s.strokes=L.subs.map((_,si)=>L.samp.filter((_,i)=>L.sampS[i]===si).map(q=>[q[0],q[1]]));end()}};

let last=performance.now();
(function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  draw(dt); drawFx(dt); requestAnimationFrame(loop);
})(last);
