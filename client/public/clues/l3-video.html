<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gợi ý địa điểm</title>
<style>
  :root { --bg: #17100b; --ink: #fdf3dc; --amber: #f3a82a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: radial-gradient(ellipse 80% 50% at 50% 50%, #2a1a0e, var(--bg)); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  h1 { margin: 0; font-size: 1.5rem; color: var(--amber); }
  p { margin: 0; max-width: 32rem; }
  video { max-width: 100%; max-height: 80vh; border-radius: 12px; background: #000; box-shadow: 0 8px 30px rgba(0, 0, 0, .55); }
</style>
</head>
<body>
<h1>Gợi ý địa điểm</h1>
<video controls playsinline preload="metadata" src="l3-goi-y.mp4"></video>
</body>
</html>
