<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gợi ý địa điểm</title>
<style>
  * { box-sizing: border-box; }
  :root { --w: min(40vw, 420px); }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: #111; }
  .wrap { display: flex; align-items: flex-start; gap: 8px; }
  .ghe { width: var(--w); height: auto; display: block; border-radius: 12px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  #loa { width: calc(var(--w) / 4); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; }
  #loa img { width: 100%; height: 100%; display: block; object-fit: contain; }
  #chuu { display: flex; gap: 4px; }
  #chuu img { width: calc(var(--w) * .57); height: auto; opacity: 0; transition: opacity .25s; }
  #chuu img.on { opacity: .35; }
</style>
</head>
<body>
<div class="wrap">
  <img class="ghe" src="l4-ghe.png" alt="">
  <div class="col">
    <button id="loa" type="button" aria-label="Phát"><img src="l4-loa.svg" alt=""></button>
    <div id="chuu"><img src="l4-chuu.png" alt=""><img src="l4-chuu.png" alt=""></div>
  </div>
</div>
<script>
  // Bấm loa: ảnh 1 hiện 1,5 giây; 1 giây sau ảnh 2 cạnh nó hiện 1,5 giây; mỗi ảnh rồi biến mất.
  var imgs = document.querySelectorAll('#chuu img'), busy = false;
  document.getElementById('loa').onclick = function () {
    if (busy) return; busy = true;
    imgs[0].classList.add('on');
    setTimeout(function () { imgs[1].classList.add('on'); }, 1000);
    setTimeout(function () { imgs[0].classList.remove('on'); }, 1500);
    setTimeout(function () { imgs[1].classList.remove('on'); busy = false; }, 2500);
  };
</script>
</body>
</html>
