<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gợi ý địa điểm</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; aspect-ratio: 1605 / 1080; width: min(100vw, 100vh * 1605 / 1080); }
  .frame img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  /* the video icon painted in the picture is the button: the music starts only after a click */
  #mv { position: absolute; left: 11.6%; top: 4.6%; width: 13.4%; height: 14.2%; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 12%; -webkit-tap-highlight-color: transparent; }
  #mv:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
<div class="frame">
  <img src="ve-dich.webp" alt="" draggable="false">
  <button id="mv" type="button" aria-label="Phát nhạc MV" aria-pressed="false"></button>
</div>
<audio id="au" src="ve-dich.mp3" preload="none" loop></audio>
<script>
  var b = document.getElementById('mv'), a = document.getElementById('au');
  b.addEventListener('click', function () {
    if (a.paused) a.play().then(function () { b.setAttribute('aria-pressed', 'true'); }, function () {});
    else { a.pause(); b.setAttribute('aria-pressed', 'false'); }
  });
</script>
</body>
</html>
