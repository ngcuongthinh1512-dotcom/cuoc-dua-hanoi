name = "cuoc-dua-hanoi"
main = "src/index.ts"
compatibility_date = "2026-09-25"

# Leg 3 Hà Nội: custom domain (the Brussels one stays with cuoc-dua-bi). Created by `wrangler deploy` (zone ceticeti.com).
routes = [{ pattern = "leg3hanoi.ceticeti.com", custom_domain = true }]

# Client build (Vite) served by Workers Static Assets; unmatched paths fall through to the Worker.
[assets]
directory = "../client/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "RACE_ROOM"
class_name = "RaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cuoc-dua-hanoi-media"
